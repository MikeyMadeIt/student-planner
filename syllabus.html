<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Syllabus · Student Planner</title>
<meta name="theme-color" content="#0a0d16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="mobile-topbar">
      <div class="brand mb-0 p-0"><span class="dot"><i class="bi bi-mortarboard"></i></span> Planner</div>
    </div>

    <div class="topbar">
      <div>
        <h1 class="page-title">Course Syllabus</h1>
        <p class="page-sub">Your subjects and their syllabi, all in one place.</p>
      </div>
      <div class="d-flex gap-2 align-items-center flex-wrap">
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('syllabusImportFile').click()"><i class="bi bi-upload me-1"></i>Import</button>
        <button class="btn btn-accent btn-sm" onclick="openCourseModal()"><i class="bi bi-plus-lg me-1"></i>Add Subject</button>
      </div>
    </div>

    <input type="file" accept="application/json" id="syllabusImportFile" hidden onchange="handleSyllabusImportFile(this)">

    <!-- Search + Sort bar -->
    <div class="d-flex gap-2 mb-3 align-items-center">
      <input class="form-control" id="syllabusSearch" placeholder="Search course title or code…"
        oninput="renderSyllabusGrid()" style="height:30px;font-size:.8rem;flex:1;min-width:0">
      <select class="form-select" id="syllabusSort" onchange="renderSyllabusGrid()"
        style="height:30px;font-size:.8rem;width:130px;flex-shrink:0">
        <option value="az">A – Z</option>
        <option value="recent">Recently Added</option>
        <option value="updated">Recently Updated</option>
      </select>
    </div>

    <!-- Card grid -->
    <div id="syllabusGrid" class="syl-list-grid stagger"></div>

  </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

<button class="fab-btn" onclick="openCourseModal()" title="Add Subject"><i class="bi bi-plus-lg"></i></button>

<!-- Add/Edit Subject Modal -->
<div class="modal fade" id="courseModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-body card-pad" id="courseModalBody"></div>
    </div>
  </div>
</div>

<!-- Import Preview Modal -->
<div class="modal fade" id="syllabusImportModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body card-pad" id="syllabusImportModalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/syllabus.js"></script>
<script>
  renderShell('syllabus');
  applyTheme();
  initSyllabusList();
</script>
</body>
</html>
