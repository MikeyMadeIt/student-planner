<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendar · Student Planner</title>
<meta name="theme-color" content="#0a0d16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="mobile-topbar"><div class="brand mb-0 p-0"><span class="dot"><i class="bi bi-mortarboard"></i></span> Planner</div></div>
    <div class="topbar">
      <div><h1 class="page-title">Calendar</h1><p class="page-sub" id="calSubtitle">Classes, tasks, and events in one place</p></div>
    </div>

    <!-- UNIFIED CALENDAR -->
    <div class="glass card-pad mb-3 fade-in">

      <!-- Header row: view toggles + add buttons -->
      <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
        <div class="cal-view-bar" role="group">
          <button class="cal-view-btn active" data-mode="month" onclick="setCalMode('month')">Month</button>
          <button class="cal-view-btn" data-mode="week" onclick="setCalMode('week')">Week</button>
          <button class="cal-view-btn" data-mode="day" onclick="setCalMode('day')">Day</button>
        </div>
        <div class="d-flex gap-2 flex-wrap">
          <button class="btn btn-ghost btn-sm" onclick="goToToday()"><i class="bi bi-arrow-return-left me-1"></i>Today</button>
          <div class="dropdown">
            <button class="btn btn-accent btn-sm dropdown-toggle" data-bs-toggle="dropdown"><i class="bi bi-plus-lg me-1"></i>Add</button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="#" onclick="openCalEventModal();return false;"><i class="bi bi-calendar-event me-2"></i>One-off Event</a></li>
              <li><a class="dropdown-item" href="#" onclick="openTaskModal();return false;"><i class="bi bi-check2-square me-2"></i>Task</a></li>
              <li><a class="dropdown-item" href="#" onclick="openScheduleModal();return false;"><i class="bi bi-calendar2-week me-2"></i>Class Schedule</a></li>
              <li><a class="dropdown-item" href="#" onclick="openUnivEventModal();return false;"><i class="bi bi-bank2 me-2"></i>University Event</a></li>
            </ul>
          </div>
        </div>
      </div>

      <!-- Filter toggles -->
      <div class="cal-filter-bar mb-3">
        <button class="cal-filter-btn f-class active" id="filter-classes" onclick="toggleFilter('classes')">
          <span class="cal-filter-dot" style="background:#7C6CF6"></span> Classes
        </button>
        <button class="cal-filter-btn f-task active" id="filter-tasks" onclick="toggleFilter('tasks')">
          <span class="cal-filter-dot" style="background:#FBBF24"></span> Tasks
        </button>
        <button class="cal-filter-btn f-event active" id="filter-events" onclick="toggleFilter('events')">
          <span class="cal-filter-dot" style="background:#34D399"></span> Events
        </button>
        <button class="cal-filter-btn f-univ active" id="filter-univ" onclick="toggleFilter('univ')">
          <span class="cal-filter-dot" style="background:#4F8CFF"></span> University
        </button>
      </div>

      <!-- Nav row -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <button class="btn-icon" onclick="navCal(-1)"><i class="bi bi-chevron-left"></i></button>
        <h4 class="mb-0" id="calTitle"></h4>
        <button class="btn-icon" onclick="navCal(1)"><i class="bi bi-chevron-right"></i></button>
      </div>

      <!-- Calendar body -->
      <div id="calBody"></div>
    </div>

    <!-- EVENT LIST -->
    <div class="glass card-pad fade-in">
      <div class="section-title" id="calEventListTitle"><i class="bi bi-list-ul"></i>All Events — This Month</div>
      <div id="calEventList"></div>
    </div>

  </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

<!-- Day Detail Modal -->
<div class="modal fade" id="dayModal" tabindex="-1" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-body card-pad" id="dayModalBody"></div>
    </div>
  </div>
</div>

<!-- Add/Edit Schedule Modal -->
<div class="modal fade" id="calSubjectModal" tabindex="-1" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-body card-pad" id="calSubjectModalBody"></div>
    </div>
  </div>
</div>

<!-- Add/Edit Task Modal -->
<div class="modal fade" id="calTaskModal" tabindex="-1" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-body card-pad" id="calTaskModalBody"></div>
    </div>
  </div>
</div>

<!-- One-off Event Modal -->
<div class="modal fade" id="calEventModal" tabindex="-1" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-body card-pad" id="calEventModalBody"></div>
    </div>
  </div>
</div>

<!-- University Event Modal -->
<div class="modal fade" id="univEventModal" tabindex="-1" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-body card-pad" id="univEventModalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/calendar.js"></script>
<script>
  renderShell('calendar');
  applyTheme();
  initCalendar();
</script>
</body>
</html>
