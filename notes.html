<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes · Student Planner</title>
<meta name="theme-color" content="#0a0d16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="mobile-topbar"><div class="brand mb-0 p-0"><span class="dot"><i class="bi bi-mortarboard"></i></span> Planner</div></div>
    <!-- NOTES PAGE HEADER -->
    <div class="nt-header fade-in">
      <div class="nt-header-text">
        <h1 class="page-title">Notes</h1>
        <p class="page-sub">Markdown notes with formatting, pins, favorites &amp; checklists</p>
      </div>
      <button class="btn btn-accent nt-add-btn" onclick="openNoteModal()"><i class="bi bi-plus-lg me-1"></i>Add Note</button>
    </div>

    <!-- NOTES CONTROLS -->
    <div class="nt-controls glass card-pad mb-3 fade-in">
      <div class="nt-controls-row">
        <div class="nt-search-wrap">
          <i class="bi bi-search nt-search-icon"></i>
          <input class="form-control nt-search-input" id="noteSearch" placeholder="Search notes…">
        </div>
        <button class="nt-icon-btn" id="favFilterBtn" onclick="toggleFavFilter()" title="Favorites">
          <i class="bi bi-star"></i>
        </button>
      </div>
      <div class="nt-filters-row">
        <select class="form-select nt-filter-sel" id="noteCatFilter">
          <option value="">All Categories</option>
          <option>Homework</option>
          <option>Project</option>
          <option>Personal</option>
          <option>Organization</option>
          <option>Ideas</option>
        </select>
        <select class="form-select nt-filter-sel" id="noteLinkFilterSel">
          <option value="all">All Notes</option>
          <option value="subject">By Subject</option>
          <option value="task">By Task</option>
          <option value="unlinked">Unlinked</option>
        </select>
        <select class="form-select nt-filter-sel" id="noteSubFilterSel" style="display:none"><option value="">All Subjects</option></select>
        <select class="form-select nt-filter-sel" id="noteTaskFilterSel" style="display:none"><option value="">All Tasks</option></select>
      </div>
    </div>
    <!-- Hidden wrappers kept for JS compatibility -->
    <div id="noteSubFilterWrap" style="display:none"></div>
    <div id="noteTaskFilterWrap" style="display:none"></div>

    <div id="notesGrid" class="row g-3 stagger"></div>
  </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

<div class="modal fade" id="noteModal" tabindex="-1" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="noteModalTitle">New Note</h5><button class="btn-close" aria-label="Close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="noteModalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/notes.js"></script>
<script>
  renderShell('notes');
  applyTheme();
  initNotes();
</script>
</body>
</html>
