<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasks · Student Planner</title>
<meta name="theme-color" content="#0a0d16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="mobile-topbar"><div class="brand mb-0 p-0"><span class="dot"><i class="bi bi-mortarboard"></i></span> Planner</div></div>

    <!-- PAGE HEADER -->
    <div class="tk-header fade-in">
      <div class="tk-header-text">
        <h1 class="page-title">Tasks</h1>
        <p class="page-sub">Stay on top of your academic and personal work.</p>
      </div>
      <button class="btn btn-accent" onclick="openTaskModal()"><i class="bi bi-plus-lg me-1"></i>Add Task</button>
    </div>

    <!-- STATS ROW -->
    <div class="tk-stats-row fade-in" id="tkStatsRow">
      <div class="tk-stat-card glass">
        <div class="tk-stat-icon tk-stat-icon-total"><i class="bi bi-list-check"></i></div>
        <div class="tk-stat-num" id="statTotal">0</div>
        <div class="tk-stat-lbl">Total Tasks</div>
      </div>
      <div class="tk-stat-card glass">
        <div class="tk-stat-icon tk-stat-icon-active"><i class="bi bi-hourglass-split"></i></div>
        <div class="tk-stat-num tk-stat-active" id="statActive">0</div>
        <div class="tk-stat-lbl">Active</div>
      </div>
      <div class="tk-stat-card glass">
        <div class="tk-stat-icon tk-stat-icon-done"><i class="bi bi-check-circle"></i></div>
        <div class="tk-stat-num tk-stat-done" id="statDone">0</div>
        <div class="tk-stat-lbl">Completed</div>
      </div>
      <div class="tk-stat-card glass">
        <div class="tk-stat-icon tk-stat-icon-overdue"><i class="bi bi-exclamation-triangle"></i></div>
        <div class="tk-stat-num tk-stat-overdue" id="statOverdue">0</div>
        <div class="tk-stat-lbl">Overdue</div>
      </div>
    </div>

    <!-- CONTROLS: SEARCH + FILTERS + SORT -->
    <div class="tk-controls glass card-pad fade-in">
      <div class="tk-search-wrap">
        <i class="bi bi-search tk-search-icon"></i>
        <input class="form-control tk-search-input" id="tkSearch" placeholder="Search tasks…">
      </div>
      <div class="tk-filter-pills" id="tkFilterPills">
        <button class="tk-pill active" data-filter="all" onclick="setFilter('all')">All</button>
        <button class="tk-pill" data-filter="active" onclick="setFilter('active')">Active</button>
        <button class="tk-pill" data-filter="completed" onclick="setFilter('completed')">Completed</button>
        <button class="tk-pill" data-filter="overdue" onclick="setFilter('overdue')">Overdue</button>
      </div>
      <div class="tk-sort-wrap">
        <select class="form-select tk-sort-select" id="tkSort" onchange="renderTasks()">
          <option value="due">Due Date</option>
          <option value="priority">Priority</option>
          <option value="created">Recently Created</option>
          <option value="updated">Recently Updated</option>
          <option value="alpha">Alphabetical</option>
        </select>
        <select class="form-select tk-sort-select" id="tkCatFilter" onchange="renderTasks()">
          <option value="">All Categories</option>
          <option>Academic</option>
          <option>Assignment</option>
          <option>Project</option>
          <option>Exam</option>
          <option>Personal</option>
          <option>Organization</option>
          <option>Other</option>
        </select>
        <select class="form-select tk-sort-select" id="tkSubFilter" onchange="renderTasks()">
          <option value="">All Subjects</option>
        </select>
      </div>
    </div>

    <!-- TASK GROUPS -->
    <div id="tkGroups"></div>

  </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

<!-- ADD/EDIT TASK MODAL -->
<div class="modal fade" id="taskModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="taskModalTitle">Add Task</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="taskModalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/tasks.js"></script>
<script>
  renderShell('tasks');
  applyTheme();
  initTasks();
</script>
</body>
</html>
