<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasks · Student Planner</title>
<meta name="theme-color" content="#0a0d16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="mobile-topbar"><div class="brand mb-0 p-0"><span class="dot"><i class="bi bi-mortarboard"></i></span> Planner</div></div>

    <!-- PAGE HEADER -->
    <div class="tk-header fade-in">
      <div class="tk-header-text">
        <h1 class="page-title">Tasks</h1>
        <p class="page-sub">Stay on top of your academic and personal work.</p>
      </div>
      <button class="btn btn-accent" onclick="openTaskModal()"><i class="bi bi-plus-lg me-1"></i>Add Task</button>
    </div>

    <!-- STATS ROW -->
    <div class="tk-stats-row fade-in" id="tkStatsRow">
      <div class="tk-stat-card glass">
        <div class="tk-stat-icon tk-stat-icon-total"><i class="bi bi-list-check"></i></div>
        <div class="tk-stat-num" id="statTotal">0</div>
        <div class="tk-stat-lbl">Total Tasks</div>
      </div>
      <div class="tk-stat-card glass">
        <div class="tk-stat-icon tk-stat-icon-active"><i class="bi bi-hourglass-split"></i></div>
        <div class="tk-stat-num tk-stat-active" id="statActive">0</div>
        <div class="tk-stat-lbl">Active</div>
      </div>
      <div class="tk-stat-card glass">
        <div class="tk-stat-icon tk-stat-icon-done"><i class="bi bi-check-circle"></i></div>
        <div class="tk-stat-num tk-stat-done" id="statDone">0</div>
        <div class="tk-stat-lbl">Completed</div>
      </div>
      <div class="tk-stat-card glass">
        <div class="tk-stat-icon tk-stat-icon-overdue"><i class="bi bi-exclamation-triangle"></i></div>
        <div class="tk-stat-num tk-stat-overdue" id="statOverdue">0</div>
        <div class="tk-stat-lbl">Overdue</div>
      </div>
    </div>

    <!-- Hidden state inputs — read by JS, not shown to user -->
    <input type="hidden" id="tkSort" value="due">
    <input type="hidden" id="tkCatFilter" value="">
    <input type="hidden" id="tkSubFilter" value="">

    <!-- CONTROLS -->
    <div class="tk-controls fade-in">
      <div class="tk-search-wrap">
        <i class="bi bi-search tk-search-icon"></i>
        <input class="form-control tk-search-input" id="tkSearch" placeholder="Search tasks…">
      </div>
      <button class="tk-icon-btn" id="filterBtn" title="Filter by status">
        <i class="bi bi-funnel"></i>
        <span class="tk-btn-dot" id="filterDot" style="display:none"></span>
      </button>
      <button class="tk-icon-btn" id="sortBtn" title="Sort and filter">
        <i class="bi bi-sliders2"></i>
        <span class="tk-btn-dot" id="sortDot" style="display:none"></span>
      </button>
    </div>

    <!-- FILTER PANEL (status) - inline below controls -->
    <div class="tk-panel" id="filterPanel" style="display:none">
      <div class="tk-pop-section-label">Status</div>
      <div class="tk-panel-opts">
        <button class="tk-panel-opt active" id="fopt-all" data-filter="all">All</button>
        <button class="tk-panel-opt" id="fopt-active" data-filter="active">Active</button>
        <button class="tk-panel-opt" id="fopt-completed" data-filter="completed">Completed</button>
        <button class="tk-panel-opt" id="fopt-overdue" data-filter="overdue">Overdue</button>
      </div>
    </div>

    <!-- SORT PANEL - inline below controls -->
    <div class="tk-panel tk-panel-wide" id="sortPanel" style="display:none">
      <div class="tk-panel-cols">
        <div class="tk-panel-col">
          <div class="tk-pop-section-label">Sort By</div>
          <div class="tk-panel-opts">
            <button class="tk-panel-opt active" data-sort="due">Due Date</button>
            <button class="tk-panel-opt" data-sort="priority">Priority</button>
            <button class="tk-panel-opt" data-sort="created">Recently Created</button>
            <button class="tk-panel-opt" data-sort="updated">Recently Updated</button>
            <button class="tk-panel-opt" data-sort="alpha">Alphabetical</button>
          </div>
        </div>
        <div class="tk-panel-col">
          <div class="tk-pop-section-label">Category</div>
          <div class="tk-panel-opts">
            <button class="tk-panel-opt active" data-cat="">All</button>
            <button class="tk-panel-opt" data-cat="Academic">Academic</button>
            <button class="tk-panel-opt" data-cat="Assignment">Assignment</button>
            <button class="tk-panel-opt" data-cat="Project">Project</button>
            <button class="tk-panel-opt" data-cat="Exam">Exam</button>
            <button class="tk-panel-opt" data-cat="Homework">Homework</button>
            <button class="tk-panel-opt" data-cat="Personal">Personal</button>
            <button class="tk-panel-opt" data-cat="Organization">Organization</button>
            <button class="tk-panel-opt" data-cat="Other">Other</button>
          </div>
        </div>
        <div class="tk-panel-col">
          <div class="tk-pop-section-label">Subject</div>
          <div class="tk-panel-opts" id="tkSubOptions">
            <button class="tk-panel-opt active" data-sub="">All</button>
          </div>
        </div>
      </div>
    </div>
    <!-- TASK GROUPS -->
    <div id="tkGroups"></div>

  </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

<!-- ADD/EDIT TASK MODAL -->
<div class="modal fade" id="taskModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="taskModalTitle">Add Task</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="taskModalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/tasks.js"></script>
<script>
  renderShell('tasks');
  applyTheme();
  initTasks();
</script>
</body>
</html>
