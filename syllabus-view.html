<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Syllabus · Student Planner</title>
<meta name="theme-color" content="#0a0d16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="mobile-topbar">
      <div class="brand mb-0 p-0"><span class="dot"><i class="bi bi-mortarboard"></i></span> Planner</div>
    </div>

    <div class="mb-3 d-flex align-items-center justify-content-between gap-2">
      <a href="syllabus.html" class="btn btn-ghost btn-sm"><i class="bi bi-arrow-left me-1"></i>All Subjects</a>
      <div class="d-flex gap-2" id="svTopActions"></div>
    </div>

    <!-- Course Info Card -->
    <div id="svInfoCard" class="mb-2"></div>

    <!-- Description (collapsible) -->
    <div id="svDescCard" class="mb-2"></div>

    <!-- Course Outcomes -->
    <div id="svOutcomesCard" class="mb-2"></div>

    <!-- Course Outline -->
    <div class="glass card-pad mb-2 fade-in" id="svOutlineCard">
      <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
        <div class="sv-section-title"><i class="bi bi-map"></i>Course Outline</div>
        <div class="d-flex gap-2 align-items-center">
          <input class="form-control" id="weekSearch" placeholder="Search weeks…"
            style="height:28px;font-size:.75rem;width:150px" oninput="renderWeeksAccordion()">
          <button class="btn btn-accent btn-sm sv-btn" onclick="openWeekModal(currentCourseId())">
            <i class="bi bi-plus-lg me-1"></i>Add Week
          </button>
        </div>
      </div>
      <div id="weeksAccordion" class="syl-week-list"></div>
    </div>

    <!-- Grading -->
    <div id="svGradingCard" class="mb-2"></div>

    <!-- Requirements -->
    <div id="svReqCard" class="mb-2"></div>

    <!-- Policies -->
    <div id="svPoliciesCard" class="mb-2"></div>

    <!-- References -->
    <div id="svRefsCard" class="mb-2"></div>

  </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

<button class="fab-btn" id="addWeekFab" onclick="openWeekModal(currentCourseId())" title="Add Week">
  <i class="bi bi-plus-lg"></i>
</button>

<!-- Edit Subject Modal -->
<div class="modal fade" id="courseModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-body card-pad" id="courseModalBody"></div>
    </div>
  </div>
</div>

<!-- Add/Edit Week Modal -->
<div class="modal fade" id="weekModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-body card-pad" id="weekModalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/syllabus.js"></script>
<script>
  renderShell('syllabus');
  applyTheme();
  initSyllabusView();
</script>
</body>
</html>
