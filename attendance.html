<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendance · Student Planner</title>
<meta name="theme-color" content="#0a0d16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<style>
  /* Attendance Statistics Grid */
  .att-stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }
  
  .att-stat-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 10px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    text-align: center;
    min-height: 80px;
  }
  
  .att-stat-card .stat-value {
    font-weight: 800;
    font-size: 1.5rem;
    font-family: var(--font-mono);
    line-height: 1;
    margin-bottom: 4px;
  }
  
  .att-stat-card .stat-label {
    font-size: 0.65rem;
    color: var(--text-faint);
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }
  
  .att-stat-card .stat-percent {
    font-size: 0.7rem;
    color: var(--text-soft);
    font-family: var(--font-mono);
  }
  
  .att-stat-card.present .stat-value { color: #34d399; }
  .att-stat-card.late .stat-value { color: #fbbf24; }
  .att-stat-card.excused .stat-value { color: #60a5fa; }
  .att-stat-card.absent .stat-value { color: #fb7185; }
  .att-stat-card.noclasses .stat-value { color: #8b5cf6; }
  
  /* Compact Ranking */
  .att-ranking-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: transparent;
    font-size: 0.78rem;
    transition: background 0.15s, border-color 0.15s;
    margin-bottom: 5px;
  }
  
  .att-ranking-row:hover {
    background: rgba(255, 255, 255, 0.04);
    border-color: rgba(var(--accent), 0.2);
  }
  
  .att-ranking-badge {
    min-width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 0.65rem;
    background: rgba(var(--accent), 0.15);
    color: rgb(var(--accent));
    flex-shrink: 0;
  }
  
  .att-ranking-code {
    font-weight: 700;
    min-width: 45px;
    white-space: nowrap;
  }
  
  .att-ranking-bar {
    flex: 1;
    min-width: 60px;
    height: 5px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }
  
  .att-ranking-bar .progress {
    height: 100%;
    margin: 0;
  }
  
  .att-ranking-percent {
    font-family: var(--font-mono);
    font-weight: 700;
    min-width: 32px;
    text-align: right;
    font-size: 0.7rem;
  }
  
  .att-ranking-count {
    font-size: 0.65rem;
    color: var(--text-faint);
    min-width: 40px;
    text-align: right;
  }
  
  /* Compact Log */
  .att-log-header {
    display: grid;
    grid-template-columns: 8px 60px 1fr 60px 28px;
    gap: 8px;
    align-items: center;
    padding: 6px 10px;
    font-size: 0.65rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-faint);
    border-bottom: 1px solid var(--border);
    margin-bottom: 6px;
    margin-left: 0;
    margin-right: 0;
  }
  
  .att-log-row {
    display: grid;
    grid-template-columns: 8px 60px 1fr 60px 28px;
    gap: 8px;
    align-items: center;
    padding: 7px 10px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: transparent;
    font-size: 0.76rem;
    transition: background 0.15s, border-color 0.15s;
    margin-bottom: 4px;
  }
  
  .att-log-row:hover {
    background: rgba(255, 255, 255, 0.04);
    border-color: rgba(var(--accent), 0.2);
  }
  
  .att-log-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  
  .att-log-date {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 0.72rem;
    white-space: nowrap;
  }
  
  .att-log-subject {
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  
  .att-log-status {
    display: flex;
    justify-content: center;
  }
  
  .att-status-badge {
    font-weight: 700;
    font-size: 0.65rem;
    padding: 2px 7px;
    border-radius: 16px;
    white-space: nowrap;
    display: inline-block;
  }
  
  .att-status-badge.present {
    background: rgba(52, 211, 153, 0.15);
    color: #34d399;
    border: 1px solid rgba(52, 211, 153, 0.3);
  }
  
  .att-status-badge.late {
    background: rgba(251, 191, 36, 0.15);
    color: #fbbf24;
    border: 1px solid rgba(251, 191, 36, 0.3);
  }
  
  .att-status-badge.absent {
    background: rgba(251, 113, 133, 0.15);
    color: #fb7185;
    border: 1px solid rgba(251, 113, 133, 0.3);
  }
  
  .att-status-badge.excused {
    background: rgba(96, 165, 250, 0.15);
    color: #60a5fa;
    border: 1px solid rgba(96, 165, 250, 0.3);
  }
  
  .att-status-badge.noclasses {
    background: rgba(139, 92, 246, 0.15);
    color: #a78bfa;
    border: 1px solid rgba(139, 92, 246, 0.3);
  }
  
  .att-log-delete {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: var(--text-soft);
    cursor: pointer;
    border-radius: 6px;
    font-size: 0.7rem;
    transition: all 0.15s;
    padding: 0;
    flex-shrink: 0;
  }
  
  .att-log-delete:hover {
    color: #fb7185;
    background: rgba(251, 113, 133, 0.1);
  }
  
  /* Responsive adjustments */
  @media (max-width: 768px) {
    .att-stats-grid {
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 8px;
    }
    
    .att-stat-card {
      min-height: 70px;
      padding: 10px 8px;
    }
    
    .att-stat-card .stat-value {
      font-size: 1.3rem;
    }
    
    .att-ranking-row {
      padding: 6px 8px;
      margin-bottom: 4px;
    }
    
    .att-ranking-code {
      font-size: 0.72rem;
    }
    
    .att-log-row {
      padding: 6px 8px;
      margin-bottom: 3px;
      font-size: 0.72rem;
    }
  }
  
  @media (max-width: 576px) {
    .att-log-header {
      display: none;
    }
    
    .att-log-row {
      grid-template-columns: 8px 50px 1fr 50px 24px;
      gap: 6px;
      font-size: 0.7rem;
    }
    
    .att-log-date {
      font-size: 0.65rem;
    }
    
    .att-status-badge {
      font-size: 0.6rem;
      padding: 2px 6px;
    }
  }
</style>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="mobile-topbar"><div class="brand mb-0 p-0"><span class="dot"><i class="bi bi-mortarboard"></i></span> Planner</div></div>
    <div class="topbar">
      <div><h1 class="page-title">Attendance Tracker</h1><p class="page-sub">Log attendance per subject and track your rate</p></div>
    </div>

    <!-- Semester Attendance + Log Attendance -->
    <div class="row g-3 mb-3">
      <div class="col-md-4"><div class="glass card-pad fade-in"><div class="section-title"><i class="bi bi-percent"></i>Overall Rate</div><div class="stat-num" id="aRate">--%</div><div class="progress my-2"><div class="progress-bar" id="aRateBar" style="width:0%"></div></div></div></div>
      <div class="col-md-8">
        <div class="glass card-pad fade-in">
          <div class="section-title"><i class="bi bi-plus-circle"></i>Log Attendance</div>
          <div class="row g-2">
            <div class="col-md-3"><select class="form-select" id="attSubject"></select></div>
            <div class="col-md-3"><input type="date" class="form-control" id="attDate" value=""></div>
            <div class="col-md-4">
              <select class="form-select" id="attStatus">
                <option>Present</option><option>Absent</option><option>Late</option><option>Excused</option><option>No Classes</option>
              </select>
            </div>
            <div class="col-md-2"><button class="btn btn-accent w-100" onclick="logAttendance()">Log</button></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Attendance Statistics -->
    <div class="glass card-pad mb-3 fade-in">
      <div class="section-title"><i class="bi bi-bar-chart"></i>Attendance Statistics</div>
      <div class="att-stats-grid" id="attendanceStats"></div>
    </div>

    <!-- Subject Ranking (Compact) -->
    <div class="glass card-pad mb-3 fade-in">
      <div class="section-title"><i class="bi bi-list-ol"></i>Subject Ranking</div>
      <div id="subjectRanking"></div>
    </div>

    <!-- Attendance Log (Compact) -->
    <div class="glass card-pad fade-in">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="section-title mb-0"><i class="bi bi-list-ul"></i>Recent Records</div>
      </div>
      <div id="attendanceLogContainer">
        <div class="att-log-header">
          <span></span>
          <span>Date</span>
          <span>Subject</span>
          <span>Status</span>
          <span></span>
        </div>
        <div id="attendanceLog" style="max-height: 450px; overflow-y: auto;"></div>
      </div>
    </div>
  </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/attendance.js"></script>
<script>
  renderShell('attendance');
  applyTheme();
  initAttendance();
</script>
</body>
</html>
