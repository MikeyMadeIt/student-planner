<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendance · Student Planner</title>
<meta name="theme-color" content="#0a0d16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="mobile-topbar"><div class="brand mb-0 p-0"><span class="dot"><i class="bi bi-mortarboard"></i></span> Planner</div></div>
    <div class="topbar">
      <div><h1 class="page-title">Attendance Tracker</h1><p class="page-sub">Log attendance per subject and track your rate</p></div>
    </div>

    <!-- Attendance Overview + Log Form -->
    <div class="row g-3 mb-3">
      <div class="col-md-4">
        <div class="glass card-pad fade-in h-100">
          <div class="section-title"><i class="bi bi-percent"></i>Overall Rate</div>
          <div class="stat-num" id="aRate">--%</div>
          <div class="progress my-2"><div class="progress-bar" id="aRateBar" style="width:0%"></div></div>
          <div class="text-faint" style="font-size:.72rem">Excludes No Classes days</div>
        </div>
      </div>
      <div class="col-md-8">
        <div class="glass card-pad fade-in">
          <div class="section-title"><i class="bi bi-plus-circle"></i>Log Attendance</div>
          <div class="row g-2">
            <div class="col-6 col-sm-3">
              <label class="att-form-label">Subject</label>
              <select class="form-select form-select-sm" id="attSubject"></select>
            </div>
            <div class="col-6 col-sm-3">
              <label class="att-form-label">Date</label>
              <input type="date" class="form-control form-control-sm" id="attDate">
            </div>
            <div class="col-6 col-sm-3">
              <label class="att-form-label">Status</label>
              <select class="form-select form-select-sm" id="attStatus">
                <option>Present</option>
                <option>Absent</option>
                <option>Late</option>
                <option>Excused</option>
                <option>No Classes</option>
              </select>
            </div>
            <div class="col-6 col-sm-3">
              <label class="att-form-label">Mode</label>
              <label class="att-online-toggle-btn form-select form-select-sm" for="attOnline">
                <input type="checkbox" id="attOnline" class="att-online-check">
                <i class="bi bi-wifi att-online-icon"></i>
                <span class="att-online-text">Online</span>
              </label>
            </div>
            <div class="col-12">
              <label class="att-form-label">Notes <span class="text-faint">(optional)</span></label>
              <input type="text" class="form-control form-control-sm" id="attNotes" placeholder="Optional note…">
            </div>
            <div class="col-12">
              <button class="btn btn-accent w-100" onclick="logAttendance()"><i class="bi bi-check2 me-1"></i>Log Attendance</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Overall Attendance Statistics -->
    <div class="glass card-pad mb-3 fade-in">
      <div class="section-title"><i class="bi bi-bar-chart"></i>Overall Statistics</div>
      <div class="att-stats-grid" id="attendanceStats"></div>
    </div>

    <!-- Absence Limits (compact summary, modal for detail) -->
    <div class="glass card-pad mb-3 fade-in">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="section-title mb-0"><i class="bi bi-shield-exclamation"></i>Absence Limits</div>
        <button class="btn btn-ghost btn-sm" onclick="openAbsenceLimitModal()">
          <i class="bi bi-gear me-1"></i>Configure
        </button>
      </div>
      <div id="absenceWarnings"></div>
    </div>

    <!-- Per-subject Attendance Breakdown -->
    <div class="glass card-pad mb-3 fade-in">
      <div class="section-title"><i class="bi bi-list-columns"></i>Attendance by Subject</div>
      <div id="subjectBreakdown"></div>
    </div>

    <!-- Attendance Log -->
    <div class="glass card-pad fade-in">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="section-title mb-0"><i class="bi bi-list-ul"></i>Attendance Log</div>
        <div id="attLogCountLabel" class="att-log-count-label"></div>
      </div>
      <div id="attendanceLog"></div>
    </div>
  </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

<!-- Absence Limit Modal -->
<div class="modal fade" id="absenceLimitModal" tabindex="-1" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-shield-exclamation me-2"></i>Absence Limits</h5>
        <button class="btn-close" aria-label="Close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="absenceLimitModalBody"></div>
    </div>
  </div>
</div>

<!-- Notes Modal -->
<div class="modal fade" id="attNotesModal" tabindex="-1" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h6 class="modal-title mb-0"><i class="bi bi-chat-left-text me-2"></i>Attendance Note</h6>
        <button class="btn-close" aria-label="Close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="attNoteContent" class="att-note-content"></div>
        <div class="att-note-meta" id="attNoteMeta"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/attendance.js"></script>
<script>
  renderShell('attendance');
  applyTheme();
  initAttendance();
</script>
</body>
</html>
