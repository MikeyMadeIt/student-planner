<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedule · Student Planner</title>
<meta name="theme-color" content="#0a0d16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">
    <div class="mobile-topbar">
      <div class="brand mb-0 p-0"><span class="dot"><i class="bi bi-mortarboard"></i></span> Planner</div>
    </div>

    <!-- Page header -->
    <div class="topbar">
      <div>
        <h1 class="page-title">Schedule</h1>
        <p class="page-sub">See what's happening today and throughout the week.</p>
      </div>
      <div class="d-flex gap-2 align-items-center flex-wrap">
        <button class="btn btn-ghost btn-sm sched-toggle-btn active" data-view="day" onclick="setSchedView('day')" title="Day view"><i class="bi bi-calendar-day"></i></button>
        <button class="btn btn-ghost btn-sm sched-toggle-btn" data-view="timetable" onclick="setSchedView('timetable')" title="Week timetable"><i class="bi bi-calendar2-week"></i></button>
        <button class="btn btn-ghost btn-sm sched-toggle-btn" data-view="list" onclick="setSchedView('list')" title="Subject list"><i class="bi bi-list-ul"></i></button>
        <button class="btn btn-accent btn-sm" onclick="openSubjectModal()"><i class="bi bi-plus-lg me-1"></i>Add Subject</button>
      </div>
    </div>

    <!-- Week navigation -->
    <div class="glass card-pad mb-3 fade-in sch-nav-card">
      <div class="d-flex align-items-center justify-content-between gap-2 mb-3">
        <button class="btn-icon sch-nav-btn" onclick="shiftWeek(-1)" title="Previous week"><i class="bi bi-chevron-left"></i></button>
        <div class="sch-week-label" id="schWeekLabel"></div>
        <button class="btn-icon sch-nav-btn" onclick="shiftWeek(1)" title="Next week"><i class="bi bi-chevron-right"></i></button>
        <button class="btn btn-ghost btn-sm sch-today-btn" onclick="goToday()">Today</button>
      </div>
      <!-- Day selector strip -->
      <div class="sch-day-strip" id="schDayStrip"></div>
    </div>

    <!-- Next class / current class card -->
    <div id="schNextCard" class="mb-3 fade-in"></div>

    <!-- Day view -->
    <div id="schDayView">
      <!-- Daily summary + timeline rendered here -->
    </div>

    <!-- Timetable view -->
    <div id="schTimetableView" class="d-none">
      <div class="glass card-pad mb-3 fade-in">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="section-title mb-0"><i class="bi bi-calendar2-week"></i>Weekly Timetable</div>
          <div class="d-flex gap-2">
            <button class="btn-icon sch-nav-btn" onclick="ttZoom(-1)" title="Zoom out"><i class="bi bi-zoom-out"></i></button>
            <button class="btn-icon sch-nav-btn" onclick="ttZoom(1)" title="Zoom in"><i class="bi bi-zoom-in"></i></button>
          </div>
        </div>
        <div class="scroll-x grabbable">
          <div id="ttGrid" style="min-width:680px"></div>
        </div>
      </div>
    </div>

    <!-- Subject list view -->
    <div id="schListView" class="d-none">
      <div class="glass card-pad mb-3 fade-in">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <div class="section-title mb-0"><i class="bi bi-journal-bookmark"></i>All Subjects</div>
          <div class="d-flex gap-2">
            <input class="form-control" id="schSearchInput" placeholder="Search…" style="height:30px;font-size:.8rem;width:160px" oninput="renderListView()">
            <button class="btn btn-ghost btn-sm" id="schArchiveBtn" onclick="toggleArchivedView()"><i class="bi bi-archive me-1"></i>Archived</button>
          </div>
        </div>
        <div id="schSubjectList" class="row g-3 stagger"></div>
      </div>
    </div>

    <!-- Today's tasks panel (day view only) -->
    <div id="schTasksPanel" class="mb-3"></div>

  </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>

<!-- Subject Modal -->
<div class="modal fade" id="subjectModal" tabindex="-1" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="subjectModalTitle">Add Subject</h5><button class="btn-close btn-close-white" aria-label="Close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="subjectModalBody"></div>
    </div>
  </div>
</div>

<!-- Subject Detail Modal -->
<div class="modal fade" id="detailModal" tabindex="-1" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content card-pad" id="detailModalBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/schedule.js"></script>
<script>
  renderShell('schedule');
  applyTheme();
  initSchedule();
</script>
</body>
</html>
